services:
  mongo-config-init:
    image: mongo:6
    container_name: mongo-config-init
    depends_on:
      - mongo-config-1
      - mongo-config-2
      - mongo-config-3
    entrypoint: >
      bash -c '
        echo "Waiting for config servers to be ready..." && sleep 5 &&
        mongosh --host mongo-config-1 --port 27017 --eval "try { rs.initiate({_id: \"mongo-config-rs\", configsvr: true, members: [{_id: 0, host: \"mongo-config-1:27017\"}, {_id: 1, host: \"mongo-config-2:27017\"}, {_id: 2, host: \"mongo-config-3:27017\"}]}) } catch(e) { print(e); }" &&
        sleep 2 &&
        echo "Config server replica set initiated."
      '

  mongo-shard-1-init:
    image: mongo:6
    container_name: mongo-shard-1-init
    depends_on:
      - mongo-shard-1-a
    entrypoint: >
      bash -c '
        echo "Waiting for shard 1 to be ready..." && sleep 5 &&
        mongosh --host mongo-shard-1-a --port 27017 --eval "try { rs.initiate({_id: \"mongo-shard-1-rs\", members: [{_id: 0, host: \"mongo-shard-1-a:27017\"}]}) } catch(e) { print(e); }" &&
        sleep 2 &&
        echo "Shard 1 replica set initiated."
      '

  mongo-shard-2-init:
    image: mongo:6
    container_name: mongo-shard-2-init
    depends_on:
      - mongo-shard-2-a
    entrypoint: >
      bash -c '
        echo "Waiting for shard 2 to be ready..." && sleep 5 &&
        mongosh --host mongo-shard-2-a --port 27017 --eval "try { rs.initiate({_id: \"mongo-shard-2-rs\", members: [{_id: 0, host: \"mongo-shard-2-a:27017\"}]}) } catch(e) { print(e); }" &&
        sleep 2 &&
        echo "Shard 2 replica set initiated."
      '
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: Asia/Taipei

  kafka-1:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-1
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      TZ: Asia/Taipei
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-consumer-groups --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-2
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      TZ: Asia/Taipei
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-consumer-groups --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka-3:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-3
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
      TZ: Asia/Taipei
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-consumer-groups --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092, kafka-2:9092, kafka-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      TZ: Asia/Taipei
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - zookeeper

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports: 
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command: 
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - weather_consumer
      - weather_pipeline
      - weather_fetcher
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      TZ: Asia/Taipei
    volumes: 
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - TZ=Asia/Taipei
  mongo-config-1:
    image: mongo:6
    container_name: mongo-config-1
    command: mongod --port 27017 --configsvr --replSet mongo-config-rs
    volumes:
      - mongo_config_1_data:/data/db
    
  mongo-config-2:
    image: mongo:6
    container_name: mongo-config-2
    command: mongod --port 27017 --configsvr --replSet mongo-config-rs
    volumes:
      - mongo_config_2_data:/data/db

  mongo-config-3:
    image: mongo:6
    container_name: mongo-config-3
    command: mongod --port 27017 --configsvr --replSet mongo-config-rs
    volumes:
      - mongo_config_3_data:/data/db

  mongo-shard-1-a:
    image: mongo:6
    container_name: mongo-shard-1-a
    command: mongod --port 27017 --shardsvr --replSet mongo-shard-1-rs
    volumes: 
      - mongo_shard_1_data:/data/db

  mongo-shard-2-a:
    image: mongo:6
    container_name: mongo-shard-2-a
    command: mongod --port 27017 --shardsvr --replSet mongo-shard-2-rs
    volumes: 
      - mongo_shard_2_data:/data/db

  mongos-router:
    image: mongo:6
    container_name: mongos-router
    command: mongos --port 27017 --configdb mongo-config-rs/mongo-config-1:27017,mongo-config-2:27017,mongo-config-3:27017 --bind_ip_all
    ports:
      - "27017:27017"
    depends_on:
      - mongo-config-init
      - mongo-shard-1-init
      - mongo-shard-2-init

  mongo-cluster-init:
    image: mongo:6
    container_name: mongo-cluster-init
    depends_on:
      - mongos-router
    volumes:
      - ../mongo-scripts:/scripts
    entrypoint: >
      bash -c '
        echo "Waiting for mongo router to be available...";
        for i in {1..30}; do
          mongosh --host mongos-router --port 27017 --eval "db.adminCommand({ ping: 1 })" && break;
          echo "mongos-router not ready, retrying in 5s...";
          sleep 5;
        done;
        echo "Running asynchronous initialization script...";
        mongosh --host mongos-router --port 27017 /scripts/init-mongo.js;
        echo "MongoDB cluster initialization script executed."
      '

  weather_pipeline:
    build:
      context: ..
      dockerfile: docker/pipeline.Dockerfile
    env_file:
      - ../config/.env
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - TZ=Asia/Taipei
    entrypoint: ["/bin/sh", "-c", "echo 'Waiting 10s for kafka cluster to stabilize....' && sleep 10 && python -m pipeline_service.main"]

    depends_on:
      kafka-1: 
        condition: service_healthy
      kafka-2: 
        condition: service_healthy
      kafka-3: 
        condition: service_healthy
      mongo-cluster-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    volumes:
      - ../logs:/app/logs
    deploy:
      replicas: 3

  weather_consumer:
    build:
      context: ..
      dockerfile: docker/consumer.Dockerfile
    env_file:
      - ../config/.env
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - TZ=Asia/Taipei
    
    entrypoint: ["/bin/sh", "-c", "echo 'Waiting 10s for kafka cluster to stabilize....' && sleep 10 && python -m consumer_service.main"]
    depends_on:
      kafka-1: 
        condition: service_healthy
      kafka-2: 
        condition: service_healthy
      kafka-3: 
        condition: service_healthy
      mongo-cluster-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    volumes:
      - ../logs:/app/logs
    deploy:
      replicas: 6
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
      
  weather_fetcher:
    build:
      context: ..
      dockerfile: docker/fetcher.Dockerfile
    ports:
      - "8002:8002"
    container_name: weather_fetcher
    env_file:
      - ../config/.env
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - TZ=Asia/Taipei
    entrypoint: ["/bin/sh", "-c", "echo 'Waiting 10s for Kafka cluster to stabilize...' && sleep 10 && python -m fetcher_service.main"]
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - ../logs:/app/logs

volumes:
  mongo_config_1_data:
  mongo_config_2_data:
  mongo_config_3_data:
  mongo_shard_1_data:
  mongo_shard_2_data:
  logs:
